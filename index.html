<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔法の筆算道場 - 完全版</title>
    <style>
        :root {
            --primary: #4CAF50; --secondary: #FFC107; --accent: #2196F3;
            --bg: #f0f4f8; --font-family: "BIZ UDPGothic", "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: var(--font-family); background: var(--bg); 
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; margin: 0; padding: 5px; overflow-x: hidden;
        }

        /* コンテナの調整：スマホでは枠を細くして中身を広く */
        .container { 
            background: white; border-radius: 20px; padding: 10px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; 
            width: 100%; max-width: 900px;
            border: 5px solid var(--primary); 
            position: relative;
        }
        @media (max-width: 767px) {
            .container { border-width: 2px; padding: 5px; border-radius: 12px; }
        }

        .game-main { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; }

        @media (min-width: 768px) {
            .game-main { flex-direction: row; justify-content: center; align-items: flex-start; padding: 10px; }
            .board-container { flex: 1; max-width: 400px; }
            .keyboard-container { width: 320px; }
            body { align-items: center; }
        }

        .top-btns { display: flex; justify-content: space-between; width: 100%; padding: 0 5px; margin-bottom: 5px; }
        .icon-btn { background: white; border: 1px solid #ccc; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-family: var(--font-family); font-size: 12px; }

        .stats-area { margin-bottom: 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .total-gems { color: #fbc02d; font-weight: bold; font-size: 18px; }
        .title-display { color: #e91e63; font-size: 13px; font-weight: bold; background: #fff9f0; padding: 2px 10px; border-radius: 20px; border: 1px solid #ffe0b2; }
        
        /* 記録・メニュー画面の重なり順を修正 */
        .menu-overlay, .record-overlay, .bonus-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; z-index: 1000; border-radius: 15px; 
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; padding: 20px; 
        }
        .record-overlay, .bonus-overlay { display: none; justify-content: flex-start; overflow-y: auto; }

        .level-btn { width: 95%; max-width: 300px; padding: 12px; margin: 5px; border: none; border-radius: 12px; font-family: var(--font-family); font-size: 14px; color: white; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.2); flex-shrink: 0; }
        .lv1 { background: #8bc34a; } .lv2 { background: #aed581; } .lv3 { background: #ff9800; } .lv4 { background: #f44336; } .lv5 { background: #9c27b0; }

        .board { 
            display: inline-grid; 
            gap: 4px; background: #fff; padding: 20px 8px 8px; 
            border-radius: 15px; border: 3px solid #ddd; margin-bottom: 10px; 
            position: relative; width: 100%;
        }
        .board.col5 { grid-template-columns: repeat(5, 1fr); }
        .board.col6 { grid-template-columns: repeat(6, 1fr); }

        .cell { aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center; font-size: min(8vw, 28px); position: relative; border-radius: 5px; font-weight: bold; }
        @media (min-width: 768px) { .cell { font-size: 26px; } }

        .num-display { position: relative; z-index: 2; pointer-events: none; }
        .memo-canvas { position: absolute; top: -16px; left: 0; width: 28px; height: 28px; background: rgba(255,243,224,0.7); border: 1px solid #ffccbc; border-radius: 4px; z-index: 10; touch-action: none; }

        .cell.input { background: #e3f2fd; border: 2px dashed var(--accent); }
        .cell.active { border: 3px solid #ff5722 !important; background: #fff; box-shadow: 0 0 8px rgba(255,87,34,0.5); }
        .cell.highlight { background: #fff59d !important; }
        .line { height: 4px; background: #444; margin: 4px 0; border-radius: 2px; }
        .line.w5 { grid-column: 1 / 6; }
        .line.w6 { grid-column: 1 / 7; }

        .keyboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 350px; margin: 0 auto; }
        .key { padding: 15px 0; font-size: 22px; border: none; border-radius: 10px; background: var(--accent); color: white; cursor: pointer; font-family: var(--font-family); box-shadow: 0 4px 0 #1976D2; flex-shrink: 0; min-height: 55px; }
        .key.ok { background: var(--primary); box-shadow: 0 4px 0 #388E3C; grid-column: span 2; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; border-radius: 15px; z-index: 2000; }
        .stat-table { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 15px; background: #f9f9f9; }
        .stat-table th, .stat-table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        .stat-table th { background: #eee; }

        .menu-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
        .menu-link { min-height: 44px; border: 2px solid #dbeafe; border-radius: 999px; padding: 8px 14px; background: #f8fbff; color: #1565c0; font: inherit; font-size: 14px; cursor: pointer; }
        .bonus-header { width: 100%; max-width: 720px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .bonus-header h2 { color: #7b1fa2; margin: 0; }
        .bonus-summary { width: 100%; max-width: 720px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
        .summary-card { background: #faf5ff; border: 2px solid #ead7f5; border-radius: 14px; padding: 10px 4px; }
        .summary-card b { display: block; color: #7b1fa2; font-size: 19px; }
        .bonus-tabs { display: flex; gap: 8px; width: 100%; max-width: 720px; margin-bottom: 12px; }
        .bonus-tab { flex: 1; min-height: 44px; border: 2px solid #ddd; border-radius: 10px; background: #fff; font: inherit; cursor: pointer; }
        .bonus-tab.active { color: #fff; border-color: #7b1fa2; background: #7b1fa2; }
        .bonus-panel { width: 100%; max-width: 720px; }
        .collection-grid, .medal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); gap: 10px; }
        .collection-card, .medal-card { min-height: 138px; border: 2px solid #e4e4e7; border-radius: 16px; padding: 11px 7px; background: #fafafa; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; }
        .collection-card.unlocked { border-color: #ffd54f; background: linear-gradient(145deg, #fffde7, #fff8e1); box-shadow: 0 4px 10px rgba(255,193,7,.18); }
        .collection-card.locked { filter: grayscale(1); color: #777; }
        .collection-icon { font-size: 38px; line-height: 1; }
        .collection-name, .medal-name { font-weight: bold; font-size: 13px; }
        .collection-hint, .medal-hint { font-size: 11px; line-height: 1.5; color: #666; }
        .medal-card { min-height: 115px; }
        .medal-card.earned { border-color: #9c27b0; background: #f8effc; }
        .medal-icon { font-size: 30px; }
        .daily-card { text-align: left; border: 2px solid #bbdefb; background: #f4faff; border-radius: 16px; padding: 14px; }
        .stamp-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 12px; }
        .stamp { aspect-ratio: 1; border-radius: 50%; border: 2px dashed #90a4ae; display: grid; place-items: center; font-size: min(5vw, 24px); background: #fff; }
        .stamp.done { border: 2px solid #ff9800; background: #fff3e0; }
        .progress-track { height: 12px; overflow: hidden; border-radius: 999px; background: #e0e0e0; margin: 8px 0; }
        .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #7b1fa2, #e91e63); transition: width .4s ease; }
        .new-unlock { display: none; color: #7b1fa2; font-size: 15px; background: #f8effc; border: 2px solid #ce93d8; border-radius: 14px; padding: 9px 14px; margin: -4px 12px 14px; animation: pop .45s ease-out; }
        .particle { position: fixed; z-index: 3000; pointer-events: none; font-size: 22px; animation: sparkle 1.1s ease-out forwards; }
        @keyframes sparkle { 0% { transform: translate(0,0) scale(.5) rotate(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(1.2) rotate(220deg); opacity: 0; } }
        @keyframes pop { 0% { transform: scale(.75); opacity: 0; } 70% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
        @media (max-width: 520px) {
            .bonus-overlay { padding: 12px 8px; }
            .bonus-summary { grid-template-columns: repeat(3, 1fr); font-size: 11px; }
            .collection-grid, .medal-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .collection-card { min-height: 126px; padding: 8px 3px; }
        }
        @media (prefers-reduced-motion: reduce) { .particle, .new-unlock { animation: none; } }
    </style>
</head>
<body>

<div class="container">
    <div id="levelMenu" class="menu-overlay">
        <h2 style="color:var(--primary); margin-bottom:10px;">修行を選べ！</h2>
        <button class="level-btn lv1" onclick="startLevel(1)">Lv1 (💎1) 2×1</button>
        <button class="level-btn lv2" onclick="startLevel(2)">Lv2 (💎2) 2×2 かんたん</button>
        <button class="level-btn lv3" onclick="startLevel(3)">Lv3 (💎3) 2×2 ふつう</button>
        <button class="level-btn lv4" onclick="startLevel(4)">Lv4 (💎4) 2×2 むずい</button>
        <button class="level-btn lv5" onclick="startLevel(5)">Lv5 (💎5) 3×2</button>
        <div class="menu-actions">
            <button class="menu-link" onclick="toggleRecord(true)">📜 修行の記録</button>
            <button class="menu-link" onclick="toggleBonus(true)">🔮 おまけ部屋</button>
        </div>
    </div>

    <div id="recordScreen" class="record-overlay">
        <h2 style="color:var(--accent);">修行の成果</h2>
        <div id="recordContent" style="width:100%;"></div>
        <button class="level-btn lv1" onclick="toggleRecord(false)" style="margin-top:20px;">閉じる</button>
        <button onclick="resetStats()" style="margin-top:25px; font-size:12px; color:#999; background:none; border:none; text-decoration: underline;">成績をリセットする</button>
    </div>

    <div id="bonusScreen" class="bonus-overlay">
        <div class="bonus-header">
            <h2>🔮 おまけ部屋</h2>
            <button class="icon-btn" onclick="toggleBonus(false)">✕ 閉じる</button>
        </div>
        <div id="bonusSummary" class="bonus-summary"></div>
        <div class="bonus-tabs" role="tablist" aria-label="おまけ部屋の切り替え">
            <button id="tabCollection" class="bonus-tab active" onclick="showBonusTab('collection')">魔法図鑑</button>
            <button id="tabMedals" class="bonus-tab" onclick="showBonusTab('medals')">メダル</button>
            <button id="tabDaily" class="bonus-tab" onclick="showBonusTab('daily')">スタンプ</button>
        </div>
        <div id="bonusContent" class="bonus-panel"></div>
    </div>

    <div class="top-btns">
        <button class="icon-btn" onclick="backToMenu()">🏠 メニュー</button>
        <div><button class="icon-btn" onclick="toggleBonus(true)">🔮 おまけ</button> <button class="icon-btn" onclick="toggleRecord(true)">📜 記録</button></div>
    </div>

    <div class="stats-area">
        <div class="total-gems">💎 宝石: <span id="totalGemsCount">0</span></div>
        <div id="title-box" class="title-display">称号: <span id="currentTitle">かけだし</span></div>
    </div>
    
    <div class="game-main">
        <div class="board-container">
            <div class="board" id="board"></div>
            <div style="margin-top:5px;"><button onclick="clearAllMemos()" style="font-size:12px; color:#666; background:#eee; border:1px solid #ccc; padding:5px 10px; border-radius:5px; cursor:pointer;">メモをすべて消す</button></div>
        </div>
        <div class="keyboard-container">
            <div class="keyboard">
                <button class="key" onclick="numInput(1)">1</button><button class="key" onclick="numInput(2)">2</button><button class="key" onclick="numInput(3)">3</button>
                <button class="key" onclick="numInput(4)">4</button><button class="key" onclick="numInput(5)">5</button><button class="key" onclick="numInput(6)">6</button>
                <button class="key" onclick="numInput(7)">7</button><button class="key" onclick="numInput(8)">8</button><button class="key" onclick="numInput(9)">9</button>
                <button class="key" style="background:#f44336; box-shadow: 0 4px 0 #b71c1c;" onclick="numInput('del')">↩</button><button class="key" onclick="numInput(0)">0</button><div class="key" style="visibility:hidden;"></div>
                <button class="key ok" onclick="check()">OK!</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="clearOverlay">
        <h2 id="clearMsg" style="font-size:32px; color:var(--primary);">合格！</h2>
        <div id="gemsDisplay" style="font-size:40px; margin-bottom:20px;"></div>
        <div id="unlockMessage" class="new-unlock"></div>
        <button class="key" style="width:150px" onclick="initGame()">次へ</button>
    </div>
</div>

<script>
    const titles = ["魔法のたまご", "見習い魔法使い", "呪文の初心者", "ほうき乗り志望", "薬草の鑑定士", "魔法の筆使い", "星読みの生徒", "杖の選び手", "図書館の番人", "【一人前魔法使い】", "【筆算の神】"];
    const collectionItems = [
        { gems:0, icon:'🥚', name:'星のたまご', text:'最初の魔法のなかま' },
        { gems:3, icon:'🐣', name:'ぴよスター', text:'小さな光を集める' },
        { gems:8, icon:'🐈', name:'つきねこ', text:'夜の計算がとくい' },
        { gems:15, icon:'🦉', name:'ものしりフクロウ', text:'筆算を見守る先生' },
        { gems:25, icon:'🦊', name:'ほのおギツネ', text:'元気な魔法の案内役' },
        { gems:40, icon:'🐸', name:'まほうガエル', text:'こたえへ大ジャンプ' },
        { gems:60, icon:'🦄', name:'にじユニコーン', text:'七色のひらめきを持つ' },
        { gems:85, icon:'🐲', name:'ちびドラゴン', text:'くり上がりを守る' },
        { gems:115, icon:'🧚', name:'星のようせい', text:'がんばりを星に変える' },
        { gems:150, icon:'🐉', name:'天空ドラゴン', text:'魔法界の伝説のなかま' },
        { gems:200, icon:'🪄', name:'伝説のつえ', text:'選ばれた魔法使いの証' },
        { gems:300, icon:'👑', name:'筆算の王冠', text:'図鑑さいごの秘宝' }
    ];
    const medals = [
        { icon:'🌱', name:'はじめの一歩', hint:'1問合格', test:s => totalSolves(s) >= 1 },
        { icon:'🔥', name:'修行に夢中', hint:'10問合格', test:s => totalSolves(s) >= 10 },
        { icon:'💯', name:'百戦錬磨', hint:'100問合格', test:s => totalSolves(s) >= 100 },
        { icon:'🌈', name:'五つの魔法', hint:'全レベルで合格', test:s => [1,2,3,4,5].every(l => s[`lv${l}`].solve > 0) },
        { icon:'🧹', name:'Lv5への旅', hint:'Lv5で5問合格', test:s => s.lv5.solve >= 5 },
        { icon:'📅', name:'七日の星', hint:'7日分のスタンプ', test:s => Object.keys(s.daily || {}).length >= 7 }
    ];
    let n1, n2, steps=[], cur=0, currentLevel = 1;
    let bonusTab = 'collection', bonusReturnToMenu = true;
    let stats = normalizeStats(JSON.parse(localStorage.getItem('mathStats') || 'null'));

    function normalizeStats(data) {
        const base = data && typeof data === 'object' ? data : {};
        base.totalGems = Number(base.totalGems) || 0;
        [1,2,3,4,5].forEach(lv => {
            const old = base[`lv${lv}`] || {};
            base[`lv${lv}`] = { solve:Number(old.solve)||0, miss:Number(old.miss)||0 };
        });
        base.daily = base.daily && typeof base.daily === 'object' ? base.daily : {};
        return base;
    }

    function totalSolves(s = stats) { return [1,2,3,4,5].reduce((sum, lv) => sum + s[`lv${lv}`].solve, 0); }
    function localDate(offset = 0) {
        const d = new Date(); d.setDate(d.getDate() + offset);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function playMagicSound() {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            [523,659,784].forEach((freq, i) => {
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.value = freq;
                gain.gain.setValueAtTime(.0001, ctx.currentTime + i*.07);
                gain.gain.exponentialRampToValueAtTime(.13, ctx.currentTime + i*.07 + .015);
                gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + i*.07 + .18);
                osc.connect(gain).connect(ctx.destination); osc.start(ctx.currentTime + i*.07); osc.stop(ctx.currentTime + i*.07 + .2);
            });
            setTimeout(() => ctx.close(), 700);
        } catch (_) {}
    }

    function save() { localStorage.setItem('mathStats', JSON.stringify(stats)); }
    function startLevel(lv) { currentLevel = lv; document.getElementById('levelMenu').style.display = 'none'; initGame(); }
    function backToMenu() { document.getElementById('levelMenu').style.display = 'flex'; }
    
    // 記録画面の表示切り替え
    function toggleRecord(show) { 
        if(show) updateRecordHTML();
        document.getElementById('recordScreen').style.display = show ? 'flex' : 'none'; 
    }

    function toggleBonus(show) {
        if(show) {
            bonusReturnToMenu = document.getElementById('levelMenu').style.display !== 'none';
            renderBonus(); document.getElementById('levelMenu').style.display = 'none';
        }
        document.getElementById('bonusScreen').style.display = show ? 'flex' : 'none';
        if(!show && bonusReturnToMenu) document.getElementById('levelMenu').style.display = 'flex';
    }

    function showBonusTab(tab) { bonusTab = tab; renderBonus(); }

    function renderBonus() {
        const unlocked = collectionItems.filter(item => stats.totalGems >= item.gems).length;
        const earned = medals.filter(medal => medal.test(stats)).length;
        const stamped = Object.keys(stats.daily).length;
        document.getElementById('bonusSummary').innerHTML =
            `<div class="summary-card"><b>${unlocked}/${collectionItems.length}</b>図鑑</div>` +
            `<div class="summary-card"><b>${earned}/${medals.length}</b>メダル</div>` +
            `<div class="summary-card"><b>${stamped}日</b>修行</div>`;
        ['Collection','Medals','Daily'].forEach(name => document.getElementById(`tab${name}`).classList.toggle('active', bonusTab === name.toLowerCase()));
        const content = document.getElementById('bonusContent');
        if(bonusTab === 'collection') {
            const next = collectionItems.find(item => stats.totalGems < item.gems);
            const progress = next ? Math.min(100, stats.totalGems / next.gems * 100) : 100;
            content.innerHTML = `<p style="margin-top:0;">宝石を集めると、魔法のなかまや秘宝が目を覚ますよ。</p>` +
                (next ? `<div style="font-size:12px;">次のなかままで、あと <b>${next.gems - stats.totalGems}</b> 💎</div><div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>` : `<p>🎉 魔法図鑑コンプリート！</p>`) +
                `<div class="collection-grid">${collectionItems.map(item => {
                    const open = stats.totalGems >= item.gems;
                    return `<div class="collection-card ${open?'unlocked':'locked'}"><div class="collection-icon">${open?item.icon:'❔'}</div><div class="collection-name">${open?item.name:'まだ ひみつ'}</div><div class="collection-hint">${open?item.text:`💎${item.gems}で解放`}</div></div>`;
                }).join('')}</div>`;
        } else if(bonusTab === 'medals') {
            content.innerHTML = `<p style="margin-top:0;">いろいろな修行に挑戦して、メダルを集めよう。</p><div class="medal-grid">${medals.map(medal => {
                const got = medal.test(stats);
                return `<div class="medal-card ${got?'earned':''}"><div class="medal-icon">${got?medal.icon:'🔒'}</div><div class="medal-name">${medal.name}</div><div class="medal-hint">${medal.hint}${got?'　達成！':''}</div></div>`;
            }).join('')}</div>`;
        } else {
            const todayCount = stats.daily[localDate()] || 0;
            const questDone = Math.min(todayCount, 3);
            const stamps = Array.from({length:7}, (_, i) => {
                const offset = i - 6, key = localDate(offset), done = !!stats.daily[key];
                const label = offset === 0 ? '今日' : `${new Date(`${key}T12:00:00`).getDate()}日`;
                return `<div><div class="stamp ${done?'done':''}">${done?'⭐':'・'}</div><div style="font-size:10px;text-align:center;margin-top:3px;">${label}</div></div>`;
            }).join('');
            content.innerHTML = `<div class="daily-card"><b>今日のミニクエスト</b><p>どのレベルでも3問合格しよう！　${questDone}/3</p><div class="progress-track"><div class="progress-fill" style="width:${questDone/3*100}%"></div></div>${questDone === 3 ? '<p>🎁 達成！ 今日の修行はばっちり！</p>' : '<p style="font-size:12px;color:#555;">1問合格すると、その日に星のスタンプがつくよ。</p>'}<div class="stamp-row">${stamps}</div></div>`;
        }
    }

    function updateRecordHTML() {
        let html = `<table class="stat-table"><tr><th>レベル</th><th>合格</th><th>ミス</th></tr>`;
        [1,2,3,4,5].forEach(lv => { 
            const d = stats[`lv${lv}`] || {solve:0, miss:0};
            html += `<tr><td>Lv${lv}</td><td>${d.solve}回</td><td>${d.miss}回</td></tr>`; 
        });
        document.getElementById('recordContent').innerHTML = html + `</table>`;
    }

    function resetStats() { 
        if(confirm("これまでの修行の記録をすべてリセットしますか？")){ 
            stats = normalizeStats(null);
            save(); updateStats(); toggleRecord(false); 
        } 
    }

    function initGame() {
        document.getElementById('clearOverlay').style.display='none';
        const b = document.getElementById('board');
        if (currentLevel === 5) { b.className = "board col6"; setup3x2(); } 
        else { b.className = "board col5"; setup2x2(); }
        render(); cur=0; checkAutoSkip(); update();
    }

    function setup2x2() {
        if(currentLevel === 1) {
            n1 = Math.floor(Math.random() * 90) + 10; n2 = Math.floor(Math.random() * 9) + 1;
        } else if(currentLevel === 2) {
            n1 = (Math.floor(Math.random()*4)+1)*10 + (Math.floor(Math.random()*5));
            n2 = (Math.floor(Math.random()*4)+1)*10 + (Math.floor(Math.random()*5));
        } else {
            n1 = Math.floor(Math.random()*90)+10; n2 = Math.floor(Math.random()*90)+10;
        }
        const d10=Math.floor(n2/10), d1=n2%10, p1=n1*d1, p2=n1*d10, total=n1*n2;
        
        if(currentLevel === 1) {
            steps = [
                {id:'p1_1', ans:p1%10, h:[3,8]}, {id:'p1_10', ans:Math.floor(p1/10)%10, h:[2,8]}, 
                {id:'p1_100', ans:Math.floor(p1/100)||0, h:[2,8], skip:(Math.floor(p1/100)===0)}
            ];
        } else {
            steps = [
                {id:'p1_1', ans:p1%10, h:[3,8]}, {id:'p1_10', ans:Math.floor(p1/10)%10, h:[2,8]}, 
                {id:'p1_100', ans:Math.floor(p1/100)||0, h:[2,8], skip:(Math.floor(p1/100)===0)},
                {id:'p2_10', ans:p2%10, h:[3,7]}, {id:'p2_100', ans:Math.floor(p2/10)%10, h:[2,7]}, 
                {id:'p2_1000', ans:Math.floor(p2/100)||0, h:[2,7], skip:(Math.floor(p2/100)===0)},
                {id:'a1', ans:total%10, h:[13,18]}, {id:'a10', ans:Math.floor(total/10)%10, h:[12,17]}, {id:'a100', ans:Math.floor(total/100)%10, h:[11,16]}, 
                {id:'a1000', ans:Math.floor(total/1000)||0, h:[10,15], skip:(Math.floor(total/1000)===0)}
            ];
        }
    }

    function setup3x2() {
        n1 = Math.floor(Math.random() * 900) + 100; n2 = Math.floor(Math.random() * 90) + 10;
        const d10=Math.floor(n2/10), d1=n2%10, p1=n1*d1, p2=n1*d10, total=n1*n2;
        steps = [
            {id:'p1_1', ans:p1%10, h:[4,10]}, {id:'p1_10', ans:Math.floor(p1/10)%10, h:[3,10]}, {id:'p1_100', ans:Math.floor(p1/100)%10, h:[2,10]}, 
            {id:'p1_1000', ans:Math.floor(p1/1000)||0, h:[2,10], skip:(Math.floor(p1/1000)===0)},
            {id:'p2_10', ans:p2%10, h:[4,9]}, {id:'p2_100', ans:Math.floor(p2/10)%10, h:[3,9]}, {id:'p2_1000', ans:Math.floor(p2/100)%10, h:[2,9]}, 
            {id:'p2_10000', ans:Math.floor(p2/1000)||0, h:[2,9], skip:(Math.floor(p2/1000)===0)},
            {id:'a1', ans:total%10, h:[16,22]}, {id:'a10', ans:Math.floor(total/10)%10, h:[15,21]}, {id:'a100', ans:Math.floor(total/100)%10, h:[14,20]}, {id:'a1000', ans:Math.floor(total/1000)%10, h:[13,19]}, 
            {id:'a10000', ans:Math.floor(total/10000)||0, h:[12,18], skip:(Math.floor(total/10000)===0)}
        ];
    }

    function render() {
        const b = document.getElementById('board');
        let html = "";
        if (currentLevel === 5) {
            const s1=String(n1).padStart(3,' '), s2=String(n2).padStart(2,' ');
            html = `<div class="cell"></div><div class="cell"></div><div class="cell">${s1[0]}</div><div class="cell">${s1[1]}</div><div class="cell">${s1[2]}</div><div class="cell"></div>` +
                   `<div class="cell"></div><div class="cell">×</div><div class="cell"></div><div class="cell">${s2[0]}</div><div class="cell">${s2[1]}</div><div class="cell"></div>` +
                   `<div class="line w6"></div>` +
                   `<div class="cell"></div><div id="p1_1000" class="cell input"></div><div id="p1_100" class="cell input"></div><div id="p1_10" class="cell input"></div><div id="p1_1" class="cell input"></div><div class="cell"></div>` +
                   `<div id="p2_10000" class="cell input"></div><div id="p2_1000" class="cell input"></div><div id="p2_100" class="cell input"></div><div id="p2_10" class="cell input"></div><div class="cell" style="color:#ccc">0</div><div class="cell"></div>` +
                   `<div class="line w6"></div>` +
                   `<div id="a10000" class="cell input"></div><div id="a1000" class="cell input"></div><div id="a100" class="cell input"></div><div id="a10" class="cell input"></div><div id="a1" class="cell input"></div><div class="cell"></div>`;
        } else if (currentLevel === 1) {
            const s1=String(n1).padStart(2,' ');
            html = `<div class="cell"></div><div class="cell"></div><div class="cell">${s1[0]}</div><div class="cell">${s1[1]}</div><div class="cell"></div>` +
                   `<div class="cell">×</div><div class="cell"></div><div class="cell"></div><div class="cell">${n2}</div><div class="cell"></div>` +
                   `<div class="line w5"></div>` +
                   `<div class="cell"></div><div id="p1_100" class="cell input"></div><div id="p1_10" class="cell input"></div><div id="p1_1" class="cell input"></div><div class="cell"></div>`;
        } else {
            const s1=String(n1).padStart(2,' ');
            const s2=String(n2).padStart(2,' ');
            html = `<div class="cell"></div><div class="cell"></div><div class="cell">${s1[0]}</div><div class="cell">${s1[1]}</div><div class="cell"></div>` +
                   `<div class="cell">×</div><div class="cell"></div><div class="cell">${s2[0]}</div><div class="cell">${s2[1]}</div><div class="cell"></div>` +
                   `<div class="line w5"></div>` +
                   `<div class="cell"></div><div id="p1_100" class="cell input"></div><div id="p1_10" class="cell input"></div><div id="p1_1" class="cell input"></div><div class="cell"></div>` +
                   `<div id="p2_1000" class="cell input"></div><div id="p2_100" class="cell input"></div><div id="p2_10" class="cell input"></div><div class="cell" style="color:#ccc">0</div><div class="cell"></div>` +
                   `<div class="line w5"></div>` +
                   `<div id="a1000" class="cell input"></div><div id="a100" class="cell input"></div><div id="a10" class="cell input"></div><div id="a1" class="cell input"></div><div class="cell"></div>`;
        }
        b.innerHTML = html;
        document.querySelectorAll('.cell.input').forEach(el => {
            const span = document.createElement('span'); span.className = 'num-display'; el.appendChild(span);
            const canvas = document.createElement('canvas'); canvas.className = 'memo-canvas'; canvas.width = 40; canvas.height = 40; el.appendChild(canvas);
            initDrawing(canvas, el);
        });
    }

    function initDrawing(canvas, parent) {
        const ctx = canvas.getContext('2d'); ctx.strokeStyle = '#ff5722'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        let drawing = false;
        const getPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (cx - rect.left) * (canvas.width / rect.width), y: (cy - rect.top) * (canvas.height / rect.height) };
        };
        const start = (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); };
        const move = (e) => { if(!drawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
        canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', () => drawing=false);
        canvas.addEventListener('touchstart', start, {passive: false}); canvas.addEventListener('touchmove', move, {passive: false}); canvas.addEventListener('touchend', () => drawing=false);
    }

    function numInput(v) {
        const cell = document.getElementById(steps[cur].id);
        if(cell) cell.querySelector('.num-display').textContent = (v==='del' ? "" : v);
    }

    function check() {
        const s = steps[cur], cell = document.getElementById(s.id);
        if(!cell) return;
        if(cell.querySelector('.num-display').textContent !== "" && parseInt(cell.querySelector('.num-display').textContent) === s.ans) {
            cell.classList.remove('input','active'); cell.style.color="blue";
            playMagicSound(); cur++; checkAutoSkip();
            if(cur >= steps.length) gameClear(); else update();
        } else { cell.querySelector('.num-display').textContent = ""; stats[`lv${currentLevel}`].miss++; save(); }
    }

    function checkAutoSkip() {
        while (cur < steps.length && steps[cur].skip) {
            const skipCell = document.getElementById(steps[cur].id);
            if (skipCell) { skipCell.classList.remove('input','active'); skipCell.style.color = "blue"; }
            cur++;
        }
    }

    function gameClear() {
        const beforeUnlocks = collectionItems.filter(item => stats.totalGems >= item.gems).length;
        const today = localDate();
        let earn = currentLevel; stats.totalGems += earn; stats[`lv${currentLevel}`].solve++;
        stats.daily[today] = (stats.daily[today] || 0) + 1;
        save(); updateStats();
        document.getElementById('gemsDisplay').innerText = "💎".repeat(Math.min(earn, 7));
        const newItems = collectionItems.slice(beforeUnlocks).filter(item => stats.totalGems >= item.gems);
        const unlock = document.getElementById('unlockMessage');
        if(newItems.length) {
            const item = newItems[newItems.length - 1];
            unlock.innerHTML = `図鑑に新しいなかま！<br><b>${item.icon} ${item.name}</b>`;
            unlock.style.display = 'block';
        } else {
            const next = collectionItems.find(item => stats.totalGems < item.gems);
            unlock.innerHTML = next ? `次のなかままで あと <b>${next.gems - stats.totalGems} 💎</b>` : '🏆 魔法図鑑コンプリート！';
            unlock.style.display = 'block';
        }
        document.getElementById('clearOverlay').style.display='flex';
        createSparkles();
    }

    function createSparkles() {
        if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const icons = ['✨','⭐','💎','✦'];
        for(let i=0; i<14; i++) {
            const p = document.createElement('span'); p.className = 'particle';
            p.textContent = icons[i % icons.length]; p.style.left = `${45 + Math.random()*10}%`; p.style.top = `${42 + Math.random()*8}%`;
            p.style.setProperty('--x', `${(Math.random()-.5)*420}px`); p.style.setProperty('--y', `${-80-Math.random()*260}px`);
            p.style.animationDelay = `${Math.random()*.18}s`; document.body.appendChild(p);
            setTimeout(() => p.remove(), 1500);
        }
    }

    function updateStats() {
        document.getElementById('totalGemsCount').innerText = stats.totalGems;
        document.getElementById('currentTitle').innerText = titles[Math.min(Math.floor(stats.totalGems / 10), titles.length - 1)];
    }

    function update() {
        document.querySelectorAll('.cell').forEach(c=>c.classList.remove('active','highlight'));
        if(cur < steps.length) {
            const active = document.getElementById(steps[cur].id);
            if(active) active.classList.add('active');
            steps[cur].h.forEach(idx => { const t = document.querySelectorAll('.cell')[idx]; if(t) t.classList.add('highlight'); });
        }
    }

    function clearAllMemos() { document.querySelectorAll('.memo-canvas').forEach(c => c.getContext('2d').clearRect(0,0,40,40)); }
    updateStats();
</script>
