<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔法の筆算道場 - 完全版</title>
    <style>
        :root {
            --primary: #4CAF50; --secondary: #FFC107; --accent: #2196F3;
            --bg: #f0f4f8; --font-family: "BIZ UDPGothic", "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: var(--font-family); background: var(--bg); 
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; margin: 0; padding: 5px; overflow-x: hidden;
        }

        /* コンテナの調整：スマホでは枠を細くして中身を広く */
        .container { 
            background: white; border-radius: 20px; padding: 10px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; 
            width: 100%; max-width: 900px;
            border: 5px solid var(--primary); 
            position: relative;
        }
        @media (max-width: 767px) {
            .container { border-width: 2px; padding: 5px; border-radius: 12px; }
        }

        .game-main { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; }

        @media (min-width: 768px) {
            .game-main { flex-direction: row; justify-content: center; align-items: flex-start; padding: 10px; }
            .board-container { flex: 1; max-width: 400px; }
            .keyboard-container { width: 320px; }
            body { align-items: center; }
        }

        .top-btns { display: flex; justify-content: space-between; width: 100%; padding: 0 5px; margin-bottom: 5px; }
        .icon-btn { background: white; border: 1px solid #ccc; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-family: var(--font-family); font-size: 12px; }

        .stats-area { margin-bottom: 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .total-gems { color: #fbc02d; font-weight: bold; font-size: 18px; }
        .title-display { color: #e91e63; font-size: 13px; font-weight: bold; background: #fff9f0; padding: 2px 10px; border-radius: 20px; border: 1px solid #ffe0b2; }
        
        /* 記録・メニュー画面の重なり順を修正 */
        .menu-overlay, .record-overlay, .bonus-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; z-index: 1000; border-radius: 15px; 
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; padding: 20px; 
        }
        .record-overlay, .bonus-overlay { display: none; justify-content: flex-start; overflow-y: auto; }

        .start-hero { width:100%; max-width:560px; display:grid; grid-template-columns:86px 1fr; grid-template-rows:auto auto auto; gap:2px 14px; text-align:left; align-items:center; margin-bottom:10px; }
        .start-kicker { grid-column:2; color:#7b1fa2; font-size:10px; font-weight:900; letter-spacing:.12em; }
        .start-badge-wrap { grid-row:1 / span 3; width:86px; height:86px; border-radius:24px; background:linear-gradient(145deg,#fff3b0,#e7d7ff); display:grid; place-items:center; box-shadow:0 8px 18px rgba(123,31,162,.18); }
        .start-badge-wrap img { width:76px; height:76px; object-fit:contain; }
        .start-hero h1 { margin:0; color:#3f197d; font-size:clamp(25px,5vw,40px); letter-spacing:.05em; }
        .start-hero p { margin:0; color:#65707d; line-height:1.55; font-size:13px; }
        .start-progress { width:100%; max-width:560px; min-height:28px; padding:6px 12px; border-radius:999px; background:#f3efff; color:#6b4ca5; font-size:12px; font-weight:bold; text-align:left; margin-bottom:8px; }
        .level-grid { width:100%; max-width:560px; display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
        .level-btn { width:100%; min-height:86px; padding:10px 5px; margin:0; border:none; border-radius:15px; font-family:var(--font-family); color:white; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.2); flex-shrink:0; display:flex; flex-direction:column; justify-content:center; gap:4px; }
        .level-btn span { font-size:20px; font-weight:900; }
        .level-btn small { font-size:10px; line-height:1.25; }
        .level-btn b { font-size:11px; background:rgba(255,255,255,.2); border-radius:999px; padding:3px; }
        .lv1 { background: #8bc34a; } .lv2 { background: #aed581; } .lv3 { background: #ff9800; } .lv4 { background: #f44336; } .lv5 { background: #9c27b0; }

        .board { 
            display: inline-grid; 
            gap: 4px; background: #fff; padding: 20px 8px 8px; 
            border-radius: 15px; border: 3px solid #ddd; margin-bottom: 10px; 
            position: relative; width: 100%;
        }
        .board.col5 { grid-template-columns: repeat(5, 1fr); }
        .board.col6 { grid-template-columns: repeat(6, 1fr); }

        .cell { aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center; font-size: min(8vw, 28px); position: relative; border-radius: 5px; font-weight: bold; }
        @media (min-width: 768px) { .cell { font-size: 26px; } }

        .num-display { position: relative; z-index: 2; pointer-events: none; }
        .memo-canvas { position: absolute; top: -16px; left: 0; width: 28px; height: 28px; background: rgba(255,243,224,0.7); border: 1px solid #ffccbc; border-radius: 4px; z-index: 10; touch-action: none; }

        .cell.input { background: #e3f2fd; border: 2px dashed var(--accent); }
        .cell.active { border: 3px solid #ff5722 !important; background: #fff; box-shadow: 0 0 8px rgba(255,87,34,0.5); }
        .cell.highlight { background: #fff59d !important; }
        .line { height: 4px; background: #444; margin: 4px 0; border-radius: 2px; }
        .line.w5 { grid-column: 1 / 6; }
        .line.w6 { grid-column: 1 / 7; }

        .keyboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 350px; margin: 0 auto; }
        .key { padding: 15px 0; font-size: 22px; border: none; border-radius: 10px; background: var(--accent); color: white; cursor: pointer; font-family: var(--font-family); box-shadow: 0 4px 0 #1976D2; flex-shrink: 0; min-height: 55px; }
        .key.ok { background: var(--primary); box-shadow: 0 4px 0 #388E3C; grid-column: span 2; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; border-radius: 15px; z-index: 2000; }
        .stat-table { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 15px; background: #f9f9f9; }
        .stat-table th, .stat-table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        .stat-table th { background: #eee; }

        .menu-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
        .menu-link { min-height:44px; border:2px solid #dbeafe; border-radius:999px; padding:8px 14px; background:#f8fbff; color:#1565c0; font:inherit; font-size:14px; cursor:pointer; }
        .badge-menu-link { border-color:#ead7f5; background:#fbf5ff; color:#7b1fa2; }
        .bonus-header { width: 100%; max-width: 720px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .bonus-header h2 { color: #7b1fa2; margin: 0; }
        .bonus-summary { width:100%; max-width:720px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0; }
        .badge-collection-note { padding:10px 12px; margin:8px 0 14px; border-radius:12px; background:#fff8e1; border:1px solid #ffe082; color:#745b00; font-size:12px; text-align:left; }
        .summary-card { background: #faf5ff; border: 2px solid #ead7f5; border-radius: 14px; padding: 10px 4px; }
        .summary-card b { display: block; color: #7b1fa2; font-size: 19px; }
        .bonus-tabs { display: flex; gap: 8px; width: 100%; max-width: 720px; margin-bottom: 12px; }
        .bonus-tab { flex: 1; min-height: 44px; border: 2px solid #ddd; border-radius: 10px; background: #fff; font: inherit; cursor: pointer; }
        .bonus-tab.active { color: #fff; border-color: #7b1fa2; background: #7b1fa2; }
        .bonus-panel { width: 100%; max-width: 720px; }
        .collection-grid, .medal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); gap: 10px; }
        .collection-card, .medal-card { min-height: 138px; border: 2px solid #e4e4e7; border-radius: 16px; padding: 11px 7px; background: #fafafa; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; }
        .collection-card.unlocked { border-color: #ffd54f; background: linear-gradient(145deg, #fffde7, #fff8e1); box-shadow: 0 4px 10px rgba(255,193,7,.18); }
        .collection-card.locked { filter: grayscale(1); color: #777; }
        .collection-icon { font-size: 38px; line-height: 1; }
        .badge-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; width:100%; }
        .edu-badge-card { min-width:0; }
        /* 学習中はナビキャラを常時表示。メッセージだけ状況に応じて更新する。 */
        .navi-assist { display:flex; align-items:center; justify-content:center; gap:7px; min-height:52px; margin:2px auto 4px; color:#5f4b7a; font-size:12px; font-weight:bold; }
        .navi-assist img { width:52px; height:52px; object-fit:contain; flex:0 0 52px; }
        .navi-assist.show { display:flex; }
        .clear-navi { display:flex; align-items:center; justify-content:center; gap:8px; min-height:52px; margin:-4px 0 8px; color:#5f4b7a; font-size:13px; font-weight:bold; }
        .clear-navi img { width:52px; height:52px; object-fit:contain; flex:0 0 52px; }
        .edu-badge-card { min-height: 190px; border: 2px solid #e4e4e7; border-radius: 16px; padding: 8px; background: #fafafa; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; text-align: center; }
        .edu-badge-card.earned { border-color: #19bfe8; background: linear-gradient(145deg, #e8fbff, #fff7c8); box-shadow: 0 4px 10px rgba(25,191,232,.18); }
        .edu-badge-card.locked img { filter: grayscale(1) opacity(.35); }
        .edu-badge-image { width:72px; height:72px; object-fit:contain; }
        @media (max-width: 720px) { .badge-grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
        @media (max-width: 520px) { .badge-grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; } .edu-badge-card { min-height:165px; padding:6px 3px; } .edu-badge-image { width:62px; height:62px; } }
        .edu-badge-name { font-weight: bold; font-size: 13px; }
        .edu-badge-hint { font-size: 11px; line-height: 1.45; color: #666; }
        .collection-name, .medal-name { font-weight: bold; font-size: 13px; }
        .collection-hint, .medal-hint { font-size: 11px; line-height: 1.5; color: #666; }
        .medal-card { min-height: 115px; }
        .medal-card.earned { border-color: #9c27b0; background: #f8effc; }
        .medal-icon { font-size: 30px; }
        .daily-card { text-align: left; border: 2px solid #bbdefb; background: #f4faff; border-radius: 16px; padding: 14px; }
        .stamp-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 12px; }
        .stamp { aspect-ratio: 1; border-radius: 50%; border: 2px dashed #90a4ae; display: grid; place-items: center; font-size: min(5vw, 24px); background: #fff; }
        .stamp.done { border: 2px solid #ff9800; background: #fff3e0; }
        .progress-track { height: 12px; overflow: hidden; border-radius: 999px; background: #e0e0e0; margin: 8px 0; }
        .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #7b1fa2, #e91e63); transition: width .4s ease; }
        .new-unlock { display: none; color: #7b1fa2; font-size: 15px; background: #f8effc; border: 2px solid #ce93d8; border-radius: 14px; padding: 9px 14px; margin: -4px 12px 14px; animation: pop .45s ease-out; }
        .particle { position: fixed; z-index: 3000; pointer-events: none; font-size: 22px; animation: sparkle 1.1s ease-out forwards; }
        @keyframes sparkle { 0% { transform: translate(0,0) scale(.5) rotate(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(1.2) rotate(220deg); opacity: 0; } }
        @keyframes pop { 0% { transform: scale(.75); opacity: 0; } 70% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
        @media (max-width: 620px) { .level-grid { grid-template-columns:repeat(3,1fr); } .start-hero { grid-template-columns:70px 1fr; } .start-badge-wrap { width:70px; height:70px; } .start-badge-wrap img { width:62px; height:62px; } }
        @media (max-width: 520px) {
            .bonus-overlay { padding: 12px 8px; }
            .bonus-summary { grid-template-columns: repeat(3, 1fr); font-size: 11px; }
            .collection-grid, .medal-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .collection-card { min-height: 126px; padding: 8px 3px; }
        }
        @media (prefers-reduced-motion: reduce) { .particle, .new-unlock { animation: none; } }
    </style>

</style></head>
<body>

<div class="container">
    <div id="levelMenu" class="menu-overlay">
        <div class="start-hero">
            <div class="start-kicker">MAGICAL CALCULATION QUEST</div>
            <div class="start-badge-wrap"><img src="https://tt-sensei.github.io/edu-assets/assets/web/badges/math/calculation/badge.webp" alt="計算マスターバッジ"></div>
            <h1>魔法のかけ算</h1>
            <p>筆算の呪文を身につけて、<br>バッジを集めよう！</p>
        </div>
        <div class="start-progress" id="startProgress"></div>
        <div class="level-grid">
            <button class="level-btn lv1" onclick="startLevel(1)"><span>Lv1</span><small>2×1　まずは一歩</small><b>はじめる</b></button>
            <button class="level-btn lv2" onclick="startLevel(2)"><span>Lv2</span><small>2×2　かんたん</small><b>はじめる</b></button>
            <button class="level-btn lv3" onclick="startLevel(3)"><span>Lv3</span><small>2×2　ふつう</small><b>はじめる</b></button>
            <button class="level-btn lv4" onclick="startLevel(4)"><span>Lv4</span><small>2×2　むずかしい</small><b>はじめる</b></button>
            <button class="level-btn lv5" onclick="startLevel(5)"><span>Lv5</span><small>3×2　さいごの試練</small><b>はじめる</b></button>
        </div>
        <div class="menu-actions">
            <button class="menu-link" onclick="toggleRecord(true)">📜 修行の記録</button>
            <button class="menu-link badge-menu-link" onclick="toggleBonus(true)">🏅 バッジコレクション</button>
        </div>
    </div>

    <div id="recordScreen" class="record-overlay">
        <h2 style="color:var(--accent);">修行の成果</h2>
        <div id="recordContent" style="width:100%;"></div>
        <button class="level-btn lv1" onclick="toggleRecord(false)" style="margin-top:20px;">閉じる</button>
        <button onclick="resetStats()" style="margin-top:25px; font-size:12px; color:#999; background:none; border:none; text-decoration: underline;">成績をリセットする</button>
    </div>

    <div id="bonusScreen" class="bonus-overlay">
        <div class="bonus-header">
            <h2>🔮 おまけ部屋</h2>
            <button class="icon-btn" onclick="toggleBonus(false)">✕ 閉じる</button>
        </div>
        <div id="bonusSummary" class="bonus-summary"></div>
        <div class="bonus-tabs" role="tablist" aria-label="バッジコレクション">
            <button id="tabBadges" class="bonus-tab active" onclick="showBonusTab('badges')">🏅 バッジコレクション</button>
        </div>
        <div id="bonusContent" class="bonus-panel"></div>
    </div>

    <div class="top-btns">
        <button class="icon-btn" onclick="backToMenu()">🏠 メニュー</button>
        <div><button class="icon-btn" onclick="toggleBonus(true)">🔮 おまけ</button> <button class="icon-btn" onclick="toggleRecord(true)">📜 記録</button></div>
    </div>

    <div class="stats-area">
        <div class="total-gems">💎 宝石: <span id="totalGemsCount">0</span></div>
        <div id="title-box" class="title-display">称号: <span id="currentTitle">かけだし</span></div>
    </div>
    <div id="naviAssist" class="navi-assist" aria-live="polite">
        <img src="https://tt-sensei.github.io/navi-character-/assets/web/characters/nami/expressions/01-normal-smile.webp" alt="">
        <span>いっしょに考えてみよう！</span>
    </div>
    
    <div class="game-main">
        <div class="board-container">
            <div class="board" id="board"></div>
            <div style="margin-top:5px;"><button onclick="clearAllMemos()" style="font-size:12px; color:#666; background:#eee; border:1px solid #ccc; padding:5px 10px; border-radius:5px; cursor:pointer;">メモをすべて消す</button></div>
        </div>
        <div class="keyboard-container">
            <div class="keyboard">
                <button class="key" onclick="numInput(1)">1</button><button class="key" onclick="numInput(2)">2</button><button class="key" onclick="numInput(3)">3</button>
                <button class="key" onclick="numInput(4)">4</button><button class="key" onclick="numInput(5)">5</button><button class="key" onclick="numInput(6)">6</button>
                <button class="key" onclick="numInput(7)">7</button><button class="key" onclick="numInput(8)">8</button><button class="key" onclick="numInput(9)">9</button>
                <button class="key" style="background:#f44336; box-shadow: 0 4px 0 #b71c1c;" onclick="numInput('del')">↩</button><button class="key" onclick="numInput(0)">0</button><div class="key" style="visibility:hidden;"></div>
                <button class="key ok" onclick="check()">OK!</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="clearOverlay">
        <h2 id="clearMsg" style="font-size:32px; color:var(--primary);">合格！</h2>
        <div id="clearNavi" class="clear-navi">
            <img src="https://tt-sensei.github.io/navi-character-/assets/web/characters/saku/expressions/08-celebrating.webp" alt="">
            <span>よくできたね！</span>
        </div>
        <div id="gemsDisplay" style="font-size:40px; margin-bottom:20px;"></div>
        <div id="unlockMessage" class="new-unlock"></div>
        <button class="key" style="width:150px" onclick="initGame()">次へ</button>
    </div>
</div>

<script>
    const titles = ["魔法のたまご", "見習い魔法使い", "呪文の初心者", "ほうき乗り志望", "薬草の鑑定士", "魔法の筆使い", "星読みの生徒", "杖の選び手", "図書館の番人", "【一人前魔法使い】", "【筆算の神】"];
    const collectionItems = [
        { gems:0, icon:'🥚', name:'星のたまご', text:'最初の魔法のなかま' },
        { gems:3, icon:'🐣', name:'ぴよスター', text:'小さな光を集める' },
        { gems:8, icon:'🐈', name:'つきねこ', text:'夜の計算がとくい' },
        { gems:15, icon:'🦉', name:'ものしりフクロウ', text:'筆算を見守る先生' },
        { gems:25, icon:'🦊', name:'ほのおギツネ', text:'元気な魔法の案内役' },
        { gems:40, icon:'🐸', name:'まほうガエル', text:'こたえへ大ジャンプ' },
        { gems:60, icon:'🦄', name:'にじユニコーン', text:'七色のひらめきを持つ' },
        { gems:85, icon:'🐲', name:'ちびドラゴン', text:'くり上がりを守る' },
        { gems:115, icon:'🧚', name:'星のようせい', text:'がんばりを星に変える' },
        { gems:150, icon:'🐉', name:'天空ドラゴン', text:'魔法界の伝説のなかま' },
        { gems:200, icon:'🪄', name:'伝説のつえ', text:'選ばれた魔法使いの証' },
        { gems:300, icon:'👑', name:'筆算の王冠', text:'図鑑さいごの秘宝' }
    ];
    const medals = [
        { icon:'🌱', name:'はじめの一歩', hint:'1問合格', test:s => totalSolves(s) >= 1 },
        { icon:'🔥', name:'修行に夢中', hint:'10問合格', test:s => totalSolves(s) >= 10 },
        { icon:'💯', name:'百戦錬磨', hint:'100問合格', test:s => totalSolves(s) >= 100 },
        { icon:'🌈', name:'五つの魔法', hint:'全レベルで合格', test:s => [1,2,3,4,5].every(l => s[`lv${l}`].solve > 0) },
        { icon:'🧹', name:'Lv5への旅', hint:'Lv5で5問合格', test:s => s.lv5.solve >= 5 },
        { icon:'📅', name:'七日の星', hint:'7日分のスタンプ', test:s => Object.keys(s.daily || {}).length >= 7 }
    ];
    const eduBadges = [
        { slug:'first-step', root:'common', name:'はじめの一歩', hint:'1問クリア', test:s => totalSolves(s) >= 1 },
        { slug:'challenger', root:'common', name:'チャレンジャー', hint:'5問クリア', test:s => totalSolves(s) >= 5 },
        { slug:'great-answer', root:'common', name:'ナイスアンサー', hint:'10問クリア', test:s => totalSolves(s) >= 10 },
        { slug:'keep-going', root:'common', name:'継続パワー', hint:'3日以上取り組む', test:s => Object.keys(s.daily || {}).length >= 3 },
        { slug:'practice-master', root:'common', name:'れんしゅう名人', hint:'30問クリア', test:s => totalSolves(s) >= 30 },
        { slug:'calculation', root:'math', name:'計算マスター', hint:'計算修行を始める', test:s => totalSolves(s) >= 1 },
        { slug:'number-sense', root:'math', name:'数となかよし', hint:'Lv1を5問クリア', test:s => s.lv1.solve >= 5 },
        { slug:'logical-thinking', root:'math', name:'すじみち思考', hint:'全レベルに挑戦', test:s => [1,2,3,4,5].every(l => s[`lv${l}`].solve > 0) },
        { slug:'strategy', root:'math', name:'作戦名人', hint:'Lv5を5問クリア', test:s => s.lv5.solve >= 5 },
        { slug:'math-discovery', root:'math', name:'算数のひみつ', hint:'50問クリア', test:s => totalSolves(s) >= 50 },
        { slug:'accuracy', root:'common', name:'正確チャレンジ', hint:'20問クリア', test:s => totalSolves(s) >= 20 },
        { slug:'focus', root:'common', name:'集中タイム', hint:'Lv2を10問クリア', test:s => s.lv2.solve >= 10 },
        { slug:'problem-solver', root:'common', name:'問題解決名人', hint:'25問クリア', test:s => totalSolves(s) >= 25 },
        { slug:'hard-worker', root:'common', name:'努力のつみ重ね', hint:'75問クリア', test:s => totalSolves(s) >= 75 },
        { slug:'level-up', root:'common', name:'レベルアップ', hint:'Lv3を5問クリア', test:s => s.lv3.solve >= 5 },
        { slug:'mastery', root:'common', name:'修行マスター', hint:'150問クリア', test:s => totalSolves(s) >= 150 },
        { slug:'never-give-up', root:'common', name:'あきらめない心', hint:'ミスのあとに20問クリア', test:s => totalSolves(s) >= 20 && [1,2,3,4,5].some(l => s[`lv${l}`].miss > 0) },
        { slug:'streak', root:'common', name:'連続修行', hint:'5日分のスタンプ', test:s => Object.keys(s.daily || {}).length >= 5 },
        { slug:'independent', root:'common', name:'ひとりで挑戦', hint:'全レベルで3問以上クリア', test:s => [1,2,3,4,5].every(l => s[`lv${l}`].solve >= 3) },
        { slug:'champion', root:'common', name:'筆算チャンピオン', hint:'全レベルで10問以上クリア', test:s => [1,2,3,4,5].every(l => s[`lv${l}`].solve >= 10) }
    ];
    const eduBadgeImage = badge => `https://tt-sensei.github.io/edu-assets/assets/web/badges/${badge.root}/${badge.slug}/badge.webp`;
    const naviCharacters = ['nami','saku','tsuki','kai','sora','riku'];
    const naviExpressions = {
        normal: '01-normal-smile.png',
        encouraging: '07-encouraging.png',
        celebrating: '08-celebrating.png',
        troubled: '06-troubled.png'
    };
    let n1, n2, steps=[], cur=0, currentLevel = 1, naviTimer;
    function naviImage(mood = 'normal') {
        const character = naviCharacters[Math.floor(Math.random() * naviCharacters.length)];
        const expression = naviExpressions[mood] || naviExpressions.normal;
        return `https://tt-sensei.github.io/navi-character-/assets/web/characters/${character}/expressions/${expression.replace('.png','.webp')}`;
    }
    function showNavi(message, mood = 'normal', duration = 2200) {
        const box = document.getElementById('naviAssist');
        if (!box) return;
        box.querySelector('img').src = naviImage(mood);
        box.querySelector('span').textContent = message;
        box.classList.add('show');
        /* ナビキャラは学習中ずっと表示。durationは互換性のため受け取るが非表示にはしない。 */
        clearTimeout(naviTimer);
    }
    function showClearNavi(message = 'よくできたね！') {
        const box = document.getElementById('clearNavi');
        if (!box) return;
        box.querySelector('img').src = naviImage('celebrating');
        box.querySelector('span').textContent = message;
    }
    let bonusTab = 'badges', bonusReturnToMenu = true;
    let stats = normalizeStats(JSON.parse(localStorage.getItem('mathStats') || 'null'));

    function normalizeStats(data) {
        const base = data && typeof data === 'object' ? data : {};
        base.totalGems = Number(base.totalGems) || 0;
        [1,2,3,4,5].forEach(lv => {
            const old = base[`lv${lv}`] || {};
            base[`lv${lv}`] = { solve:Number(old.solve)||0, miss:Number(old.miss)||0 };
        });
        base.daily = base.daily && typeof base.daily === 'object' ? base.daily : {};
        return base;
    }

    function totalSolves(s = stats) { return [1,2,3,4,5].reduce((sum, lv) => sum + s[`lv${lv}`].solve, 0); }
    function localDate(offset = 0) {
        const d = new Date(); d.setDate(d.getDate() + offset);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function playMagicSound() {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            [523,659,784].forEach((freq, i) => {
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.value = freq;
                gain.gain.setValueAtTime(.0001, ctx.currentTime + i*.07);
                gain.gain.exponentialRampToValueAtTime(.13, ctx.currentTime + i*.07 + .015);
                gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + i*.07 + .18);
                osc.connect(gain).connect(ctx.destination); osc.start(ctx.currentTime + i*.07); osc.stop(ctx.currentTime + i*.07 + .2);
            });
            setTimeout(() => ctx.close(), 700);
        } catch (_) {}
    }

    function save() { localStorage.setItem('mathStats', JSON.stringify(stats)); }
    function startLevel(lv) { currentLevel = lv; document.getElementById('levelMenu').style.display = 'none'; showNavi('あせらず、じっくり考えよう！','encouraging',2600); initGame(); }
    function backToMenu() { document.getElementById('levelMenu').style.display = 'flex'; }
    
    // 記録画面の表示切り替え
    function toggleRecord(show) { 
        if(show) updateRecordHTML();
        document.getElementById('recordScreen').style.display = show ? 'flex' : 'none'; 
    }

    function toggleBonus(show) {
        if(show) {
            bonusReturnToMenu = document.getElementById('levelMenu').style.display !== 'none';
            renderBonus(); document.getElementById('levelMenu').style.display = 'none';
        }
        document.getElementById('bonusScreen').style.display = show ? 'flex' : 'none';
        if(!show && bonusReturnToMenu) document.getElementById('levelMenu').style.display = 'flex';
    }

    function showBonusTab(tab) { bonusTab = tab; renderBonus(); }

    function renderBonus() {
        const earned = eduBadges.filter(badge => badge.test(stats)).length;
        const stamped = Object.keys(stats.daily).length;
        document.getElementById('bonusSummary').innerHTML =
            `<div class="summary-card"><b>${earned}/${eduBadges.length}</b>獲得バッジ</div>` +
            `<div class="summary-card"><b>${totalSolves(stats)}</b>クリア問題</div>` +
            `<div class="summary-card"><b>${stamped}日</b>修行日数</div>`;
        document.getElementById('tabBadges').classList.add('active');
        document.getElementById('bonusContent').innerHTML =
            `<p style="margin-top:0;">計算の力や挑戦の積み重ねで、edu-assetsのバッジが解放されるよ。</p>
             <div class="badge-collection-note">バッジはゲームの記録といっしょに保存されます。次のバッジをめざして修行しよう！</div>
             <div class="badge-grid">${eduBadges.map(badge => {
                const got = badge.test(stats);
                return `<div class="edu-badge-card ${got?'earned':'locked'}">
                    <img class="edu-badge-image" src="${eduBadgeImage(badge)}" alt="${got?badge.name:'未獲得バッジ'}">
                    <div class="edu-badge-name">${got?badge.name:'？？？'}</div>
                    <div class="edu-badge-hint">${got?badge.hint:'条件：'+badge.hint}</div>
                </div>`;
             }).join('')}</div>`;
    }

    function updateRecordHTML() {
        let html = `<table class="stat-table"><tr><th>レベル</th><th>合格</th><th>ミス</th></tr>`;
        [1,2,3,4,5].forEach(lv => { 
            const d = stats[`lv${lv}`] || {solve:0, miss:0};
            html += `<tr><td>Lv${lv}</td><td>${d.solve}回</td><td>${d.miss}回</td></tr>`; 
        });
        document.getElementById('recordContent').innerHTML = html + `</table>`;
    }

    function resetStats() { 
        if(confirm("これまでの修行の記録をすべてリセットしますか？")){ 
            stats = normalizeStats(null);
            save(); updateStats(); toggleRecord(false); 
        } 
    }

    function initGame() {
        document.getElementById('clearOverlay').style.display='none';
        const b = document.getElementById('board');
        if (currentLevel === 5) { b.className = "board col6"; setup3x2(); } 
        else { b.className = "board col5"; setup2x2(); }
        render(); cur=0; checkAutoSkip(); update();
    }

    function setup2x2() {
        if(currentLevel === 1) {
            n1 = Math.floor(Math.random() * 90) + 10; n2 = Math.floor(Math.random() * 9) + 1;
        } else if(currentLevel === 2) {
            n1 = (Math.floor(Math.random()*4)+1)*10 + (Math.floor(Math.random()*5));
            n2 = (Math.floor(Math.random()*4)+1)*10 + (Math.floor(Math.random()*5));
        } else {
            n1 = Math.floor(Math.random()*90)+10; n2 = Math.floor(Math.random()*90)+10;
        }
        const d10=Math.floor(n2/10), d1=n2%10, p1=n1*d1, p2=n1*d10, total=n1*n2;
        
        if(currentLevel === 1) {
            steps = [
                {id:'p1_1', ans:p1%10, h:[3,8]}, {id:'p1_10', ans:Math.floor(p1/10)%10, h:[2,8]}, 
                {id:'p1_100', ans:Math.floor(p1/100)||0, h:[2,8], skip:(Math.floor(p1/100)===0)}
            ];
        } else {
            steps = [
                {id:'p1_1', ans:p1%10, h:[3,8]}, {id:'p1_10', ans:Math.floor(p1/10)%10, h:[2,8]}, 
                {id:'p1_100', ans:Math.floor(p1/100)||0, h:[2,8], skip:(Math.floor(p1/100)===0)},
                {id:'p2_10', ans:p2%10, h:[3,7]}, {id:'p2_100', ans:Math.floor(p2/10)%10, h:[2,7]}, 
                {id:'p2_1000', ans:Math.floor(p2/100)||0, h:[2,7], skip:(Math.floor(p2/100)===0)},
                {id:'a1', ans:total%10, h:[13,18]}, {id:'a10', ans:Math.floor(total/10)%10, h:[12,17]}, {id:'a100', ans:Math.floor(total/100)%10, h:[11,16]}, 
                {id:'a1000', ans:Math.floor(total/1000)||0, h:[10,15], skip:(Math.floor(total/1000)===0)}
            ];
        }
    }

    function setup3x2() {
        n1 = Math.floor(Math.random() * 900) + 100; n2 = Math.floor(Math.random() * 90) + 10;
        const d10=Math.floor(n2/10), d1=n2%10, p1=n1*d1, p2=n1*d10, total=n1*n2;
        steps = [
            {id:'p1_1', ans:p1%10, h:[4,10]}, {id:'p1_10', ans:Math.floor(p1/10)%10, h:[3,10]}, {id:'p1_100', ans:Math.floor(p1/100)%10, h:[2,10]}, 
            {id:'p1_1000', ans:Math.floor(p1/1000)||0, h:[2,10], skip:(Math.floor(p1/1000)===0)},
            {id:'p2_10', ans:p2%10, h:[4,9]}, {id:'p2_100', ans:Math.floor(p2/10)%10, h:[3,9]}, {id:'p2_1000', ans:Math.floor(p2/100)%10, h:[2,9]}, 
            {id:'p2_10000', ans:Math.floor(p2/1000)||0, h:[2,9], skip:(Math.floor(p2/1000)===0)},
            {id:'a1', ans:total%10, h:[16,22]}, {id:'a10', ans:Math.floor(total/10)%10, h:[15,21]}, {id:'a100', ans:Math.floor(total/100)%10, h:[14,20]}, {id:'a1000', ans:Math.floor(total/1000)%10, h:[13,19]}, 
            {id:'a10000', ans:Math.floor(total/10000)||0, h:[12,18], skip:(Math.floor(total/10000)===0)}
        ];
    }

    function render() {
        const b = document.getElementById('board');
        let html = "";
        if (currentLevel === 5) {
            const s1=String(n1).padStart(3,' '), s2=String(n2).padStart(2,' ');
            html = `<div class="cell"></div><div class="cell"></div><div class="cell">${s1[0]}</div><div class="cell">${s1[1]}</div><div class="cell">${s1[2]}</div><div class="cell"></div>` +
                   `<div class="cell"></div><div class="cell">×</div><div class="cell"></div><div class="cell">${s2[0]}</div><div class="cell">${s2[1]}</div><div class="cell"></div>` +
                   `<div class="line w6"></div>` +
                   `<div class="cell"></div><div id="p1_1000" class="cell input"></div><div id="p1_100" class="cell input"></div><div id="p1_10" class="cell input"></div><div id="p1_1" class="cell input"></div><div class="cell"></div>` +
                   `<div id="p2_10000" class="cell input"></div><div id="p2_1000" class="cell input"></div><div id="p2_100" class="cell input"></div><div id="p2_10" class="cell input"></div><div class="cell" style="color:#ccc">0</div><div class="cell"></div>` +
                   `<div class="line w6"></div>` +
                   `<div id="a10000" class="cell input"></div><div id="a1000" class="cell input"></div><div id="a100" class="cell input"></div><div id="a10" class="cell input"></div><div id="a1" class="cell input"></div><div class="cell"></div>`;
        } else if (currentLevel === 1) {
            const s1=String(n1).padStart(2,' ');
            html = `<div class="cell"></div><div class="cell"></div><div class="cell">${s1[0]}</div><div class="cell">${s1[1]}</div><div class="cell"></div>` +
                   `<div class="cell">×</div><div class="cell"></div><div class="cell"></div><div class="cell">${n2}</div><div class="cell"></div>` +
                   `<div class="line w5"></div>` +
                   `<div class="cell"></div><div id="p1_100" class="cell input"></div><div id="p1_10" class="cell input"></div><div id="p1_1" class="cell input"></div><div class="cell"></div>`;
        } else {
            const s1=String(n1).padStart(2,' ');
            const s2=String(n2).padStart(2,' ');
            html = `<div class="cell"></div><div class="cell"></div><div class="cell">${s1[0]}</div><div class="cell">${s1[1]}</div><div class="cell"></div>` +
                   `<div class="cell">×</div><div class="cell"></div><div class="cell">${s2[0]}</div><div class="cell">${s2[1]}</div><div class="cell"></div>` +
                   `<div class="line w5"></div>` +
                   `<div class="cell"></div><div id="p1_100" class="cell input"></div><div id="p1_10" class="cell input"></div><div id="p1_1" class="cell input"></div><div class="cell"></div>` +
                   `<div id="p2_1000" class="cell input"></div><div id="p2_100" class="cell input"></div><div id="p2_10" class="cell input"></div><div class="cell" style="color:#ccc">0</div><div class="cell"></div>` +
                   `<div class="line w5"></div>` +
                   `<div id="a1000" class="cell input"></div><div id="a100" class="cell input"></div><div id="a10" class="cell input"></div><div id="a1" class="cell input"></div><div class="cell"></div>`;
        }
        b.innerHTML = html;
        document.querySelectorAll('.cell.input').forEach(el => {
            const span = document.createElement('span'); span.className = 'num-display'; el.appendChild(span);
            const canvas = document.createElement('canvas'); canvas.className = 'memo-canvas'; canvas.width = 40; canvas.height = 40; el.appendChild(canvas);
            initDrawing(canvas, el);
        });
    }

    function initDrawing(canvas, parent) {
        const ctx = canvas.getContext('2d'); ctx.strokeStyle = '#ff5722'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        let drawing = false;
        const getPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (cx - rect.left) * (canvas.width / rect.width), y: (cy - rect.top) * (canvas.height / rect.height) };
        };
        const start = (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); };
        const move = (e) => { if(!drawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
        canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', () => drawing=false);
        canvas.addEventListener('touchstart', start, {passive: false}); canvas.addEventListener('touchmove', move, {passive: false}); canvas.addEventListener('touchend', () => drawing=false);
    }

    function numInput(v) {
        const cell = document.getElementById(steps[cur].id);
        if(cell) cell.querySelector('.num-display').textContent = (v==='del' ? "" : v);
    }

    function check() {
        const s = steps[cur], cell = document.getElementById(s.id);
        if(!cell) return;
        if(cell.querySelector('.num-display').textContent !== "" && parseInt(cell.querySelector('.num-display').textContent) === s.ans) {
            cell.classList.remove('input','active'); cell.style.color="blue";
            playMagicSound(); showNavi('その調子！','encouraging',1200); cur++; checkAutoSkip();
            if(cur >= steps.length) gameClear(); else update();
        } else { cell.querySelector('.num-display').textContent = ""; stats[`lv${currentLevel}`].miss++; save(); showNavi('もういちど！ 位に気をつけよう。','troubled',2400); }
    }

    function checkAutoSkip() {
        while (cur < steps.length && steps[cur].skip) {
            const skipCell = document.getElementById(steps[cur].id);
            if (skipCell) { skipCell.classList.remove('input','active'); skipCell.style.color = "blue"; }
            cur++;
        }
    }

    function gameClear() {
        const beforeBadges = eduBadges.filter(badge => badge.test(stats)).length;
        const today = localDate();
        const earn = currentLevel;
        stats.totalGems += earn; stats[`lv${currentLevel}`].solve++;
        stats.daily[today] = (stats.daily[today] || 0) + 1;
        save(); updateStats();
        document.getElementById('gemsDisplay').innerText = "💎".repeat(Math.min(earn, 7));
        const newBadges = eduBadges.filter(badge => badge.test(stats)).slice(beforeBadges);
        const unlock = document.getElementById('unlockMessage');
        if(newBadges.length) {
            const badge = newBadges[newBadges.length - 1];
            unlock.innerHTML = `新しいバッジをゲット！<br><b>🏅 ${badge.name}</b>`;
        } else {
            const next = eduBadges.find(badge => !badge.test(stats));
            unlock.innerHTML = next ? `次のバッジをめざそう！<br><small>${next.hint}</small>` : '🏆 バッジコレクション コンプリート！';
        }
        unlock.style.display = 'block';
        showClearNavi(newBadges.length ? 'バッジもゲット！' : 'よくできたね！');
        document.getElementById('clearOverlay').style.display='flex';
        createSparkles();
    }

    function createSparkles() {
        if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const icons = ['✨','⭐','💎','✦'];
        for(let i=0; i<14; i++) {
            const p = document.createElement('span'); p.className = 'particle';
            p.textContent = icons[i % icons.length]; p.style.left = `${45 + Math.random()*10}%`; p.style.top = `${42 + Math.random()*8}%`;
            p.style.setProperty('--x', `${(Math.random()-.5)*420}px`); p.style.setProperty('--y', `${-80-Math.random()*260}px`);
            p.style.animationDelay = `${Math.random()*.18}s`; document.body.appendChild(p);
            setTimeout(() => p.remove(), 1500);
        }
    }

    function updateStats() {
        document.getElementById('totalGemsCount').innerText = stats.totalGems;
        document.getElementById('currentTitle').innerText = titles[Math.min(Math.floor(stats.totalGems / 10), titles.length - 1)];
        const progress = document.getElementById('startProgress');
        if (progress) {
            const earned = eduBadges.filter(badge => badge.test(stats)).length;
            progress.innerHTML = `🏅 バッジ ${earned}/${eduBadges.length}　｜　💎 宝石 ${stats.totalGems}　｜　クリア ${totalSolves(stats)}問`;
        }
    }

    function update() {
        document.querySelectorAll('.cell').forEach(c=>c.classList.remove('active','highlight'));
        if(cur < steps.length) {
            const active = document.getElementById(steps[cur].id);
            if(active) active.classList.add('active');
            steps[cur].h.forEach(idx => { const t = document.querySelectorAll('.cell')[idx]; if(t) t.classList.add('highlight'); });
        }
    }

    function clearAllMemos() { document.querySelectorAll('.memo-canvas').forEach(c => c.getContext('2d').clearRect(0,0,40,40)); }
    updateStats();
</script>

function renderBattle(){var b=battle;var s=getStage(b.stage);var q=b.questions[b.index];var enemyPath="monsters/"+(b.boss?"boss/":"zako/")+b.monster;screen("fb-battle-screen",'<section class="fb-battle"><aside class="fb-side player"><img src="'+charImg(state.selectedCharacter)+'" alt=""><div class="name">'+roles[state.selectedCharacter]+'</div>'+bar(b.hp,b.maxHp)+'<small>HP '+b.hp+'/'+b.maxHp+'</small></aside><section class="fb-center"><div class="fb-battle-top"><span class="fb-pill">'+s.name+' '+(b.boss?"大ボス":"モンスター")+'</span><span class="fb-pill">問題 '+(b.index+1)+' / '+b.questions.length+'</span><span class="fb-pill">🔥 '+b.combo+'コンボ</span><span class="fb-pill">⏱ '+Math.floor((Date.now()-b.start)/1000)+'秒</span></div><div class="fb-question"><div><div class="stage">'+(b.boss?"BOSS ":"")+"筆算の問題　／　"+modeForLevel(b.lv)+'</div><div class="fb-problem">'+esc(q.display)+'</div><div class="fb-feedback" id="fb-feedback">答えを入力して「決定」</div></div></div><div class="fb-answer"><input id="fb-input" inputmode="numeric" autocomplete="off" aria-label="答え"><button class="fb-btn primary" data-fb="answer">決定</button></div><div class="fb-numpad">'+[1,2,3,4,5,6,7,8,9,"⌫",0].map(function(x){return '<button class="fb-btn" data-key="'+x+'">'+x+'</button>'}).join("")+'</div><p class="fb-mini">ヒント：'+q.a+'を'+q.b+'こ分。位をそろえて考えよう。</p></section><aside class="fb-side enemy"><img src="'+FANTASY+enemyPath+'" alt="'+esc(monsterNames[b.monster]||"モンスター")+'"><div class="name">'+(monsterNames[b.monster]||"モンスター")+'</div>'+bar(b.enemyHp,b.enemyMaxHp)+'<small>HP '+b.enemyHp+'/'+b.enemyMaxHp+'</small></aside></section>');document.getElementById("fb-input").focus()}
function effect(text,cls){var e=document.getElementById("fb-effect");e.textContent=text;e.className="fb-effect show "+(cls||"");setTimeout(function(){e.className="fb-effect"},700)}
function tone(type){if(state.settings.muted)return;try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;var c=new C(),o=c.createOscillator(),g=c.createGain();o.type=type==="bad"?"sawtooth":"sine";o.frequency.value=type==="special"?880:type==="bad"?180:660;g.gain.value=.08;o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+(type==="special"?0.32:0.12));setTimeout(function(){c.close()},500)}catch(e){}}
function recordAnswer(p,ok){var s=pstat(p);s.attempts++;s.lastAskedAt=Date.now();if(ok){s.correct++;s.reviewCorrectStreak=(s.reviewActive?s.reviewCorrectStreak:0)+1;s.history.push({at:Date.now(),ok:true});if(s.reviewActive&&s.reviewCorrectStreak>=2)s.reviewActive=false}else{s.wrong++;s.lastWrongAt=Date.now();s.reviewActive=true;s.reviewCorrectStreak=0;s.history.push({at:Date.now(),ok:false});if(!state.reviewQueue.includes(p.id))state.reviewQueue.push(p.id)}s.recentResults=(s.recentResults||[]).concat(ok?1:0).slice(-8);if(!state.mastery[p.id]&&s.correct>=5)state.mastery[p.id]={basic:true,at:Date.now()};save()}
function answer(){if(!battle)return;var input=document.getElementById("fb-input"),v=Number(input.value),q=battle.questions[battle.index];if(!input.value)return;var ok=v===q.answer;recordAnswer(q,ok);var f=document.getElementById("fb-feedback");if(ok){battle.correct++;battle.combo++;battle.maxCombo=Math.max(battle.maxCombo,battle.combo);var special=battle.combo%5===0;var dmg=special?2:1;battle.enemyHp=Math.max(0,battle.enemyHp-dmg);tone(special?"special":"good");effect(special?"SPECIAL!":"ATTACK!");f.textContent=special?"必殺技で "+dmg+" ダメージ！":"攻撃成功！ "+dmg+" ダメージ！";battle.index++;if(battle.enemyHp<=0||battle.index>=battle.questions.length){setTimeout(function(){finish(true)},550)}else{setTimeout(renderBattle,500)}}else{battle.wrong++;battle.combo=0;battle.hp--;tone("bad");effect("DAMAGE");f.textContent="もういちど。まちがいは特訓に記録したよ";if(battle.hp<=0){setTimeout(function(){finish(false)},550)}else{input.value="";}}}
function finish(win){var b=battle;var key=String(b.stage);var sp=state.stageProgress[key]||{clear:0};if(win){sp.clear=(sp.clear||0)+1;state.stageProgress[key]=sp;state.bossProgress[b.monster]=(state.bossProgress[b.monster]||0)+ (b.boss?1:0);state.monsterBook[b.monster]=state.monsterBook[b.monster]||{first:today,defeats:0,boss:b.boss};state.monsterBook[b.monster].defeats=(state.monsterBook[b.monster].defeats||0)+1;state.monsterDefeatCounts[b.monster]=(state.monsterDefeatCounts[b.monster]||0)+1;state.exp+=b.boss?30:15;var old=state.collections.length;if(typeof eduBadges!=="undefined"){eduBadges.forEach(function(x){if(x.test(state.learningStats)&&!state.collections.includes(x.slug))state.collections.push(x.slug)})}if(state.collections.length===old)state.collections.push("calculation");state.playerLevel=1+Math.floor(state.exp/100);state.maxCombos[key]=Math.max(state.maxCombos[key]||0,b.maxCombo)}state.history.push({at:Date.now(),stage:b.stage,win:win,correct:b.correct,wrong:b.wrong,maxCombo:b.maxCombo});save();renderResult(win)}
function finishLegacyFix(){return}
function renderResult(win){var b=battle;var wrong=Object.keys(state.learningStats).filter(function(k){return state.learningStats[k].lastWrongAt&&Date.now()-state.learningStats[k].lastWrongAt<120000}).slice(0,5);screen("fb-result-screen",'<section class="fb-panel fb-result '+(win?"win":"lose")+'"><div class="fb-kicker">'+(win?"QUEST COMPLETE":"QUEST CONTINUES")+'</div><h2>'+(win?"🎉 バトル勝利！":"🛡️ あと少し！")+'</h2><p>'+(win?"モンスターをこえて、学習の力を手に入れた！":"まちがいを仲間と特訓して、もう一度挑戦しよう。")+'</p><div class="fb-result-card"><div><b>'+b.correct+'</b>正解</div><div><b>'+b.wrong+'</b>ミス</div><div><b>'+b.maxCombo+'</b>最大コンボ</div><div><b>'+b.hp+'</b>残りHP</div><div><b>+'+(win?(b.boss?30:15):0)+'</b>EXP</div><div><b>'+Math.floor((Date.now()-b.start)/1000)+'秒</b>クリア時間</div></div><div class="fb-note">'+(wrong.length?"今回の特訓おすすめ："+wrong.map(function(k){return k.replace("mul-","").replace("x","×")}).join("、"):"まちがいは記録されています。")+'</div><div class="fb-result-actions"><button class="fb-btn safe" data-fb="training">🛡️ まちがいを特訓</button><button class="fb-btn primary" data-fb="retry">⚔️ もう一度</button><button class="fb-btn" data-fb="map">🗺️ 学習マップ</button><button class="fb-btn" data-fb="stages">ステージ選択</button></div></section>')}
function renderTraining(){training={lv:1,done:0,correct:0,last:null};var review=state.reviewQueue.filter(function(id){return state.learningStats[id]&&state.learningStats[id].reviewActive});var list=review.slice(0,5);screen("fb-training-screen",'<section class="fb-training"><div class="fb-panel"><h2 class="fb-section-title">🛡️ 仲間と特訓</h2><div class="fb-partner"><img src="'+charImg(state.trainingPartner)+'" alt=""><p>敵はいないよ。落ち着いて、できなかった問題を練習しよう！</p></div><div class="fb-note">おまかせ特訓は苦手問題を優先します。直後に同じ問題を連打せず、3問ほど別問題をはさんで出題します。</div><div id="fb-training-body"></div><p><button class="fb-btn" data-fb="home">ホームへ</button> <button class="fb-btn" data-fb="map">学習マップ</button></p></div></section>');renderTrainingQuestion(list)}
function renderTrainingQuestion(priority){var p=askProblem(1,true);if(training.last&&p.id===training.last)p=makeProblem(1);training.current=p;training.last=p.id;var body=document.getElementById("fb-training-body");body.innerHTML='<div class="fb-question"><div><div class="stage">特訓問題 '+(training.done+1)+'</div><div class="fb-problem">'+esc(p.display)+'</div><div class="fb-feedback" id="fb-training-feedback">ヒント：'+p.a+'を'+p.b+'こ分</div></div></div><div class="fb-answer"><input id="fb-training-input" inputmode="numeric"><button class="fb-btn safe" data-fb="training-answer">答える</button></div><div class="fb-numpad">'+[1,2,3,4,5,6,7,8,9,"⌫",0].map(function(x){return '<button class="fb-btn" data-tkey="'+x+'">'+x+'</button>'}).join("")+'</div>'}
function trainingAnswer(){var i=document.getElementById("fb-training-input"),p=training.current;if(!i.value)return;var ok=Number(i.value)===p.answer;recordAnswer(p,ok);var f=document.getElementById("fb-training-feedback");if(ok){training.correct++;f.textContent=pstat(p).reviewActive?"正解！あと1回、別のタイミングでも正解をめざそう。":"苦手を1つ克服！";tone("good");effect("GOOD!")}else{f.textContent="大丈夫。答えは記録して、次の問題へ";tone("bad")}training.done++;if(training.done>=5){save();document.getElementById("fb-training-body").innerHTML='<div class="fb-note">特訓終了！ '+training.correct+'問正解。学習マップを更新したよ。</div><button class="fb-btn primary" data-fb="stages">ぼうけんへ戻る</button>'}else{setTimeout(function(){renderTrainingQuestion([])},350)}}
function statStatus(s){if(!s||!s.attempts)return ["－ まだデータ不足",""];var r=s.correct/s.attempts;return r>=.85?["◎ とくい","good"]:r>=.6?["○ もう少し","mid"]:["△ 特訓おすすめ","bad"]}
function renderMap(){var ids=Object.keys(state.learningStats);var rec=ids.filter(function(k){return state.learningStats[k].reviewActive}).slice(0,5);var rows=ids.slice(-30).reverse().map(function(k){var s=state.learningStats[k],st=statStatus(s),master=(s.correct>=4&&s.wrong===0)?"MASTER 👑":"";return '<div class="fb-row"><div class="grow"><b>'+k.replace("mul-","").replace("x"," × ")+'</b><br><small>正答 '+s.correct+' / 試行 '+s.attempts+'　最近 '+(s.recentResults||[]).join("")+'</small></div><span class="fb-status '+st[1]+'">'+st[0]+'<br>'+master+'</span></div>'}).join("");screen("fb-map-screen",'<section class="fb-panel"><h2 class="fb-section-title">🗺️ 学習マップ</h2><div class="fb-note">MASTERは過去の達成記録、苦手度は現在の学習状態です。MASTERになった後も、特訓おすすめは別に表示されます。</div><div class="fb-card"><h3>特訓おすすめ '+rec.length+'問</h3><p>'+ (rec.length?rec.map(function(k){return k.replace("mul-","").replace("x"," × ")}).join("　"):"今はありません。バトルで力を試そう！")+'</p><button class="fb-btn safe" data-fb="training">おすすめを特訓</button></div><h3>問題ごとの学習状況</h3><div class="fb-list">'+(rows||'<p class="fb-mini">まだ問題データがありません。</p>')+'</div><p><button class="fb-btn" data-fb="home">ホームへ</button></p></section>')}
function renderBook(){var all=[];stages.forEach(function(s){all=all.concat(s.enemy.map(function(x){return {x:x,boss:false}}),s.boss.map(function(x){return {x:x,boss:true}}))});var cards=all.map(function(m){var got=state.monsterBook[m.x],path="monsters/"+(m.boss?"boss/":"zako/")+m.x;return '<div class="fb-monster '+(got?"":"locked")+'"><img src="'+FANTASY+path+'" alt=""><b>'+ (got?(monsterNames[m.x]||"モンスター"):"？？？")+'</b><small>'+(got?(m.boss?"大ボス":"モンスター")+"　撃破 "+got.defeats+"回":"未撃破")+'</small></div>'}).join("");screen("fb-book-screen",'<section class="fb-panel"><h2 class="fb-section-title">👾 モンスター図鑑</h2><div class="fb-note">出会ったモンスターは個体ごとに登録されます。ボスも毎回候補からランダム出現します。</div><div class="fb-monsters">'+cards+'</div><p><button class="fb-btn" data-fb="home">ホームへ</button></p></section>')}
function renderCollection(){var list=[];if(typeof eduBadges!=="undefined")list=eduBadges.map(function(b){var got=state.collections.includes(b.slug);return '<div class="fb-row"><img style="width:54px;height:54px;object-fit:contain" src="'+eduBadgeImage(b)+'" alt=""><div class="grow"><b>'+ (got?b.name:"？？？")+'</b><br><small>'+ (got?b.hint:"学習を続けると解放")+'</small></div></div>'}).join("");screen("fb-collection-screen",'<section class="fb-panel"><h2 class="fb-section-title">🏅 コレクション</h2><div class="fb-note">バトル勝利のあとに、学習のごほうびとして登録されます。特訓は報酬目的ではなく、苦手克服が中心です。</div><div class="fb-list">'+(list||'<p>計算バッジをめざそう！</p>')+'</div><p><button class="fb-btn" data-fb="home">ホームへ</button></p></section>')}
function renderGrowth(){var wins=state.history.filter(function(x){return x.win}).length;screen("fb-growth-screen",'<section class="fb-panel"><h2 class="fb-section-title">📜 成長記録</h2><div class="fb-grid"><div class="fb-card"><h3>冒険レベル</h3><p class="fb-title" style="font-size:32px">'+state.playerLevel+'</p><small>EXP '+state.exp+'</small></div><div class="fb-card"><h3>バトル</h3><p>勝利 '+wins+'回<br>図鑑 '+Object.keys(state.monsterBook).length+'体<br>特訓キュー '+state.reviewQueue.length+'問</p></div><div class="fb-card"><h3>習熟</h3><p>MASTERは学習マップで確認できます。苦手を克服するたびに、次の冒険が楽になります。</p></div></div><p><button class="fb-btn" data-fb="home">ホームへ</button></p></section>')}
function renderSettings(){screen("fb-settings-screen",'<section class="fb-panel"><h2 class="fb-section-title">⚙️ 設定</h2><div class="fb-setting"><span>サポートモード（初期OFF）</span><button class="fb-btn '+(state.supportMode?"safe":"")+'" data-fb="support">'+(state.supportMode?"ON":"OFF")+'</button></div><div class="fb-setting"><span>効果音</span><button class="fb-btn" data-fb="mute">'+(state.settings.muted?"OFF":"ON")+'</button></div><div class="fb-note">サポートONではHPが増えます。学習内容・問題数・クリア・MASTER・EXP・コレクションは不利になりません。</div><p><button class="fb-btn" data-fb="home">ホームへ</button></p></section>')}
function route(action){if(action==="home")renderHome();else if(action==="stages")renderStages();else if(action==="training")renderTraining();else if(action==="map")renderMap();else if(action==="book")renderBook();else if(action==="collection")renderCollection();else if(action==="growth")renderGrowth();else if(action==="settings")renderSettings();else if(action==="mute"){state.settings.muted=!state.settings.muted;save();renderSettings() }else if(action==="support"){state.supportMode=!state.supportMode;save();renderSettings()}else if(action==="retry"){chooseStage(battle.stage)}}
document.addEventListener("click",function(e){var t=e.target.closest("[data-fb]");if(t)route(t.getAttribute("data-fb"));var st=e.target.closest("[data-stage]");if(st)chooseStage(+st.getAttribute("data-stage"));var k=e.target.closest("[data-key]");if(k){var i=document.getElementById("fb-input"),v=k.getAttribute("data-key");if(v==="⌫")i.value=i.value.slice(0,-1);else i.value+=v}var tk=e.target.closest("[data-tkey]");if(tk){var ti=document.getElementById("fb-training-input"),tv=tk.getAttribute("data-tkey");if(tv==="⌫")ti.value=ti.value.slice(0,-1);else ti.value+=tv}if(e.target.closest("[data-fb=answer]"))answer();if(e.target.closest("[data-fb=training-answer]"))trainingAnswer()});
document.addEventListener("keydown",function(e){if(e.key==="Enter"){if(document.getElementById("fb-battle-screen").classList.contains("active"))answer();else if(document.getElementById("fb-training-screen").classList.contains("active"))trainingAnswer()}});
renderHome();
})();
</script></body>
</html>
